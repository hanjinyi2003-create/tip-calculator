<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .calculate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result-area {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #666;
            font-size: 14px;
        }

        .result-value {
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        .result-value.highlight {
            color: #667eea;
            font-size: 18px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            border: 1px solid #fcc;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tip Calculator</h1>

        <div class="form-group">
            <label for="bill-amount">Bill Amount ($)</label>
            <input type="number" id="bill-amount" min="0" step="0.01" placeholder="Enter bill amount">
        </div>

        <div class="form-group">
            <label for="tip-percent">Tip Percent</label>
            <select id="tip-percent">
                <option value="10">10%</option>
                <option value="15" selected>15%</option>
                <option value="20">20%</option>
            </select>
        </div>

        <div class="form-group">
            <label for="num-people">Number of People</label>
            <input type="number" id="num-people" min="1" step="1" placeholder="Enter number of people">
        </div>

        <button class="calculate-btn" id="calculate-btn">Calculate</button>

        <div class="error-message" id="error-message"></div>

        <div class="result-area" id="result-area" style="display: none;">
            <div class="result-item">
                <span class="result-label">Tip Amount</span>
                <span class="result-value">$<span id="tip-amount">0.00</span></span>
            </div>
            <div class="result-item">
                <span class="result-label">Total</span>
                <span class="result-value">$<span id="total-amount">0.00</span></span>
            </div>
            <div class="result-item">
                <span class="result-label">Per Person</span>
                <span class="result-value highlight">$<span id="per-person">0.00</span></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
